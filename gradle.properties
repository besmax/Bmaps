#Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0
org.gradle.configuration-cache=true
org.gradle.caching=true

# Download dependencies directly; the local proxy returns false 404 responses.
systemProp.http.proxyHost=
systemProp.https.proxyHost=
systemProp.socksProxyHost=

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
